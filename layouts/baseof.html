<!doctype html>
{{- $mode := hugo.Data.site.mode }}
<html lang="{{ site.Language.Locale }}"{{ if in (slice "light" "dark") $mode }} data-mode="{{ $mode }}"{{ end }}>
<head>
  {{- partial "head.html" . }}
</head>
<body>
  {{- partial "header.html" . }}
  <main class="wrap">
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "footer.html" . }}
</body>
</html>
